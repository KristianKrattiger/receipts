# Publish the committed ledgers as static pages.
#
# This job renders reports/*.json and nothing more: no browsers, no model call,
# no API keys. The reports are committed artifacts of runs that already
# happened, so the site is reproducible from the repo alone and a fork can
# build it without credentials.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: only what deploy-pages needs to mint its token.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: receipts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: receipts/package-lock.json
      - run: npm ci
      - run: npm run site -- reports/*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: receipts/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
